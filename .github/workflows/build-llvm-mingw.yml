name: Build OpenUSD 26.05 LTE (LLVM-MinGW)

on:
  push:
    branches: [main, master]
    tags: ['v*-llvm-mingw']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llvm-mingw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl file ninja-build unzip xz-utils zip

      - name: Checkout OpenUSD v26.05 custom namespace branch
        run: ./01-checkout-llvm-mingw.sh

      - name: Build Windows x86_64 package
        env:
          JOBS: '4'
        run: ./02-build-llvm-mingw.sh

      - name: Verify LLVM-MinGW and LTE outputs
        run: |
          file dist-llvm-mingw/lib/lteusd_ms.dll
          file dist-llvm-mingw/bin/tbb12.dll
          grep -E '^#define PXR_NS pxr_lte$' dist-llvm-mingw/include/pxr/pxr.h
          build-llvm-mingw/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64/bin/llvm-nm \
            --defined-only dist-llvm-mingw/lib/lteusd_ms.dll | grep pxr_lte > /dev/null

      - name: Package artifact
        run: |
          cd dist-llvm-mingw
          zip -9 -r ../openusd-26.05-lte-llvm-mingw-windows-x86_64.zip .

      - name: Create checksum
        run: |
          sha256sum openusd-26.05-lte-llvm-mingw-windows-x86_64.zip \
            > openusd-26.05-lte-llvm-mingw-windows-x86_64.zip.sha256

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: openusd-26.05-lte-llvm-mingw-windows-x86_64
          path: |
            openusd-26.05-lte-llvm-mingw-windows-x86_64.zip
            openusd-26.05-lte-llvm-mingw-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload installation tree
        uses: actions/upload-artifact@v4
        with:
          name: openusd-26.05-lte-llvm-mingw-installation
          path: dist-llvm-mingw/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged build
        uses: actions/download-artifact@v4
        with:
          name: openusd-26.05-lte-llvm-mingw-windows-x86_64
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets."
          elif ! gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OpenUSD $GITHUB_REF_NAME LTE LLVM-MinGW" \
              --generate-notes; then
            echo "Release creation raced with another job; checking again."
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/openusd-26.05-lte-llvm-mingw-windows-x86_64.zip \
            release-assets/openusd-26.05-lte-llvm-mingw-windows-x86_64.zip.sha256
